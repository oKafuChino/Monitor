# Legacy compatibility override. Sharing is enabled in compose.yaml by default.
services:
  monitor:
    environment:
      KOMARI_SHARE_LISTEN: "0.0.0.0:25775"
      KOMARI_SHARE_TRUSTED_PROXY: "${KOMARI_SHARE_TRUSTED_PROXY:-}"
    ports: !override
      - "127.0.0.1:${MONITOR_PORT:-25774}:25774"
      - "127.0.0.1:${MONITOR_SHARE_PORT:-25775}:25775"
